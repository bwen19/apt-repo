name: Generate Debian APT Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 2"

permissions:
  contents: write

jobs:
  Build-Repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repostory
        uses: actions/checkout@v7

      - name: Check gh-pages branch
        id: check_gh_pages
        run: |
          gh_pages_ref=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [ -n "$gh_pages_ref" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout apt repo
        if: steps.check_gh_pages.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: repo

      - name: Install reprepro gpg
        run: |
          sudo apt update
          sudo apt install -y reprepro gnupg

      - name: Install nFPM
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install nfpm

      - name: Generate packages
        run: |
          for script in $(ls packager/*.sh); do
            bash -c "$(cat "$script")"
          done

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PWD }}

      - name: Create Linux Repo
        run: |
          cat create-repo.sh | sed "s/THE_REAL_GPG_PUBLIC_KEY_ID/${{ steps.import_gpg.outputs.keyid }}/g" > /tmp/create-repo-temp.sh
          bash -c "$(cat /tmp/create-repo-temp.sh)"
          [ -f repo/eruhini-archive-stable.gpg ] || gpg --export ${{ steps.import_gpg.outputs.keyid }} > repo/eruhini-archive-stable.gpg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
