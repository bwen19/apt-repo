name: "vaultwarden"
arch: "amd64"
platform: "linux"
version: "REAL_VERSION"
section: "default"
priority: "extra"
provides:
  - vaultwarden
depends:
  - init-system-helpers
maintainer: "Eruhini"
description: |
  Unofficial Bitwarden compatible server written in Rust.
homepage: "https://github.com/dani-garcia/vaultwarden"
license: "AGPL-3.0"
scripts:
  postinstall: ./packages/vaultwarden/vault.postinst.sh
  preremove: ./packages/vaultwarden/vault.prerm.sh
  postremove: ./packages/vaultwarden/vault.postrm.sh
contents:
  - src: ./vaultwarden/vaultwarden
    dst: /usr/bin/vaultwarden
  - src: ./vaultwarden/web-vault/
    dst: /var/lib/vaultwarden/web-vault
    type: tree
  - src: ./packages/vaultwarden/vaultwarden.service
    dst: /lib/systemd/system/vaultwarden.service
  - src: ./packages/vaultwarden/vaultwarden.env
    dst: /etc/vaultwarden/vaultwarden.env
    type: config|noreplace
